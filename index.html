<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Rotas — Terra Milho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FAF6EC;
    --cream-2: #F2ECDC;
    --ink: #22261C;
    --ink-soft: #5B5D4F;
    --green-deep: #1F4A34;
    --green-mid: #2F6B47;
    --green-leaf: #6FA83D;
    --gold: #E3A73B;
    --gold-soft: #F3D48A;
    --red-soft: #B6493C;
    --border: #E2DAC4;
    --card-bg: #FFFFFF;
    --shadow: 0 1px 2px rgba(34,38,28,0.06), 0 8px 24px -12px rgba(34,38,28,0.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0; -webkit-text-size-adjust:100%; text-size-adjust:100%;}
  body{
    background: var(--cream);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection{ background: var(--gold-soft); }

  .app{ max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

  /* ---- Header ---- */
  header.top{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
    flex-wrap: wrap;
    padding-bottom: 22px; margin-bottom: 26px;
    border-bottom: 2px solid var(--green-deep);
  }
  .brand{ display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
  .brand .mark{
    font-family:'Fraunces', serif; font-weight:700; font-size: 15px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--green-deep); background: var(--gold-soft);
    padding: 4px 10px; border-radius: 3px;
  }
  h1{
    font-family:'Fraunces', serif; font-weight:600; font-size: 34px; margin:0;
    color: var(--green-deep); letter-spacing: -0.01em;
  }
  .subtitle{ color: var(--ink-soft); font-size: 14px; margin-top:4px; max-width:56ch; }
  .top-actions{ display:flex; gap:10px; align-items:center; }

  button, .btn{
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size: 13px;
    border-radius: 7px; border: 1px solid var(--border); background: var(--card-bg);
    color: var(--ink); padding: 9px 14px; cursor:pointer; transition: all .15s ease;
    display:inline-flex; align-items:center; gap:7px;
    -webkit-appearance:none; appearance:none; touch-action:manipulation;
  }
  button:hover{ border-color: var(--green-mid); color: var(--green-deep); }
  button.primary{ background: var(--green-deep); color: #fff; border-color: var(--green-deep); }
  button.primary:hover{ background: var(--green-mid); }

  .meta-bar{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
    font-size: 12.5px; color: var(--ink-soft); margin-bottom: 18px;
  }
  .meta-bar b{ color: var(--ink); }

  /* ---- Search ---- */
  .search-wrap{ position:relative; margin-bottom: 22px; }
  .search-wrap input{
    width:100%; padding: 12px 14px 12px 40px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--card-bg); font-size: 16px; font-family:'IBM Plex Sans',sans-serif; color:var(--ink);
    -webkit-appearance: none; appearance: none;
  }
  .search-wrap input:focus{ outline:2px solid var(--green-leaf); outline-offset:1px; }
  .search-wrap svg{ position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:0.45; }

  /* ---- Route grid ---- */
  #routesView h2, #detailView h2{ font-family:'Fraunces',serif; font-weight:600; font-size:20px; color:var(--green-deep); margin: 0 0 14px; }

  #dayNav{ margin-bottom: 18px; }
  .day-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .day-tab{
    font-family:'IBM Plex Sans',sans-serif; font-weight:600; font-size:13.5px;
    padding: 10px 16px; border-radius: 9px 9px 0 0; border: 1px solid var(--border); border-bottom:none;
    background: var(--cream-2); color: var(--ink-soft); cursor:pointer; white-space:nowrap;
    transition: all .12s ease; position:relative; top:1px;
  }
  .day-tab .n{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:11px; margin-left:6px; opacity:.65; }
  .day-tab:hover{ color: var(--green-deep); }
  .day-tab.active{
    background: var(--card-bg); color: var(--green-deep); border-color: var(--green-deep);
    border-bottom: 1px solid var(--card-bg);
  }
  .day-context{
    border: 1px solid var(--border); border-top:1px solid var(--green-deep);
    background: var(--card-bg); border-radius: 0 0 10px 10px; padding: 12px 16px;
    font-size: 12.5px; color: var(--ink-soft); display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
  }
  .day-context b{ color: var(--ink); }
  .day-context .call-note{ display:flex; align-items:center; gap:6px; }
  .day-context .call-note svg{ opacity:.55; flex-shrink:0; }

  .detail-eyebrow{ font-size:12px; font-weight:600; color: var(--green-leaf); text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }

  .route-grid{
    display:grid; grid-template-columns: repeat(auto-fill, minmax(250px,1fr)); gap:14px;
  }
  .route-card{
    background: var(--card-bg); border:1px solid var(--border); border-radius: 12px;
    padding: 16px 16px 14px; cursor:pointer; text-align:left; box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
    display:flex; flex-direction:column; gap:10px; width:100%;
  }
  .route-card:hover{ transform: translateY(-2px); border-color: var(--green-leaf); }
  .route-card .rname{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; color:var(--ink); }
  .day-chips{ display:flex; gap:5px; flex-wrap:wrap; }
  .chip{
    font-size:10.5px; font-weight:600; padding: 2px 7px; border-radius: 100px;
    background: var(--cream-2); color: var(--green-deep); border:1px solid var(--border);
    text-transform:uppercase; letter-spacing:.03em;
  }
  .route-stats{ display:grid; grid-template-columns: 1fr 1fr; align-items:flex-end; margin-top:2px; column-gap:8px; }
  .route-stats > div:last-child{ text-align:right; }
  .rstat-num{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:22px; color:var(--green-deep); }
  .rstat-label{ font-size: 10.5px; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; line-height:1.3; }
  .trend-row{ display:flex; gap:10px; font-size:12px; font-family:'IBM Plex Mono',monospace; }
  .trend-row span{ display:flex; align-items:center; gap:4px; }
  .t-up{ color: var(--green-leaf); } .t-down{ color: var(--red-soft); } .t-flat{ color: var(--ink-soft); }

  .kernel-bar{ display:flex; gap:2px; height:16px; align-items:flex-end; width:100%; }
  .kernel-bar i{ flex:1; min-width:0; background: var(--gold-soft); border-radius:1px; display:block; }
  .kernel-bar i.hi{ background: var(--green-leaf); }

  /* ---- Detail view ---- */
  #detailView{ display:none; }
  .back-btn{ margin-bottom: 16px; }
  .detail-head{
    display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px;
    margin-bottom: 18px; padding-bottom:16px; border-bottom:1px solid var(--border);
  }
  .detail-head h2{ margin:0; font-size:26px; }
  .detail-sub{ color:var(--ink-soft); font-size:13px; margin-top:4px; }
  .detail-summary{ display:flex; gap:22px; flex-wrap:wrap; }
  .dsum{ text-align:right; white-space:nowrap; }
  .dsum .n{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:20px; color:var(--green-deep); }
  .dsum .l{ font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; }

  .client-block{
    background: var(--card-bg); border:1px solid var(--border); border-radius:12px;
    margin-bottom: 12px; overflow:hidden;
  }
  .client-header{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding: 13px 16px; cursor:pointer; user-select:none; touch-action:manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .client-header:hover{ background: var(--cream-2); }
  .client-name{ font-weight:600; font-size:14.5px; }
  .client-meta{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .client-right{ display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .chevron{ transition: transform .15s ease; opacity:.5; }
  .client-block.open .chevron{ transform: rotate(90deg); }
  .client-products{ display:none; border-top:1px solid var(--border); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .client-block.open .client-products{ display:block; }

  table.prod-table{ width:100%; min-width:640px; border-collapse:collapse; font-size:13px; }
  table.prod-table th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em;
    color: var(--ink-soft); font-weight:600; padding: 8px 14px; background: var(--cream-2);
    border-bottom:1px solid var(--border);
  }
  table.prod-table td{ padding: 9px 14px; border-bottom:1px solid var(--border); vertical-align:middle; }
  table.prod-table tr:last-child td{ border-bottom:none; }
  .prod-name{ font-weight:500; }
  .prod-code{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .weeks-mini{ display:flex; gap:3px; align-items:flex-end; height:22px; width:64px; }
  .weeks-mini i{ flex:1; background: var(--gold-soft); border-radius:1px; display:block; }
  .sugg{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .tend{ font-size:15px; }
  .day-tag{ font-size:10px; padding:1px 6px; border-radius:100px; background:var(--cream-2); color:var(--ink-soft); border:1px solid var(--border); }
  .reg-bar-wrap{ display:flex; align-items:center; gap:6px; }
  .reg-bar{ width:36px; height:5px; border-radius:100px; background: var(--border); overflow:hidden; }
  .reg-bar div{ height:100%; background: var(--green-leaf); }

  .empty-state{ text-align:center; padding: 60px 20px; color: var(--ink-soft); }
  .empty-state svg{ opacity:.35; margin-bottom:14px; }

  footer.foot{ margin-top: 50px; padding-top:18px; border-top:1px solid var(--border); font-size:11.5px; color:var(--ink-soft); text-align:center; }

  @media (max-width: 640px){
    h1{ font-size:26px; }
    table.prod-table{ font-size:12px; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div>
        <div class="mark">Terra Milho</div>
        <h1>Painel de Rotas</h1>
        <div class="subtitle">Sugestão de pedido e tendência de venda por cliente, consolidado das últimas 4 semanas faturadas via Omie.</div>
      </div>
    </div>
  </header>

  <div class="meta-bar">
    <div id="metaInfo"></div>
    <div id="metaCount"></div>
  </div>

  <div id="routesView">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar cliente em todas as rotas...">
    </div>
    <div id="searchResults"></div>
    <div id="dayNav">
      <div class="day-tabs" id="dayTabs"></div>
      <div class="day-context" id="dayContext"></div>
    </div>
    <div class="route-grid" id="routeGrid"></div>
  </div>

  <div id="detailView">
    <button class="back-btn" id="backBtn">← Voltar para rotas</button>
    <div class="detail-head">
      <div>
        <div class="detail-eyebrow" id="detailEyebrow"></div>
        <h2 id="detailTitle"></h2>
        <div class="detail-sub" id="detailSub"></div>
      </div>
      <div class="detail-summary" id="detailSummary"></div>
    </div>
    <div id="clientList"></div>
  </div>

  <footer class="foot">Terra Milho do Brasil — atualizado localmente a partir dos consolidados semanais do Omie. Nenhum dado é enviado a servidores externos.</footer>
</div>

<script>
// ===== Painel de Rotas — Terra Milho =====
// Dados: array de { cliente, roteiro, vendedor, codigo, produto, semanas[], semanaLabels[], media, sugestao, tendencia, regularidade, dia }
// Este painel é somente leitura: os dados vêm embutidos no HTML e são atualizados
// pela equipe comercial reenviando um novo index.html a cada rodada semanal.

let DATA = [];
let currentDay = 'Segunda';

const WEEKDAY_ORDER = ['Segunda','Terça','Quarta','Quinta','Sexta'];
const CALL_DAY_BEFORE = { 'Segunda':'sexta-feira anterior', 'Terça':'segunda-feira', 'Quarta':'terça-feira', 'Quinta':'quarta-feira', 'Sexta':'quinta-feira' };

function loadInitialData(){
  const raw = document.getElementById('embedded-data').textContent;
  DATA = JSON.parse(raw).filter(r => WEEKDAY_ORDER.includes(r.dia));
  document.getElementById('metaInfo').textContent = 'Base: consolidado semanal Omie (Segunda a Sexta)';

  // default to today's weekday if it's a business day, else Segunda
  const jsDay = new Date().getDay(); // 0=Sun..6=Sat
  const map = {1:'Segunda',2:'Terça',3:'Quarta',4:'Quinta',5:'Sexta'};
  currentDay = map[jsDay] || 'Segunda';
}

// ---------- Aggregation ----------
const PRODUCT_PRIORITY = ['P1005','P1004','P6001','P6002','P1008'];
function sortProducts(prods){
  return prods.slice().sort((a,b)=>{
    const ai = PRODUCT_PRIORITY.indexOf(a.codigo);
    const bi = PRODUCT_PRIORITY.indexOf(b.codigo);
    const aRank = ai === -1 ? 999 : ai;
    const bRank = bi === -1 ? 999 : bi;
    if(aRank !== bRank) return aRank - bRank;
    return String(a.codigo||'').localeCompare(String(b.codigo||''), undefined, {numeric:true});
  });
}

function trendClass(t){
  if(t === '▲') return 't-up';
  if(t === '▼') return 't-down';
  return 't-flat';
}
function trendGlyph(t){ return t || '–'; }

function buildRouteSummaries(dia){
  const dayRows = DATA.filter(r => r.dia === dia);
  const byRoute = {};
  for(const row of dayRows){
    const r = row.roteiro || 'N/D';
    if(!byRoute[r]) byRoute[r] = { rows: [], clients: new Set() };
    byRoute[r].rows.push(row);
    byRoute[r].clients.add(row.cliente);
  }
  const summaries = Object.entries(byRoute).map(([roteiro, info]) => {
    let sugestaoTotal = 0, up = 0, down = 0, flat = 0;
    const weeklyTotals = [0,0,0,0];
    for(const row of info.rows){
      sugestaoTotal += Number(row.sugestao) || 0;
      if(row.tendencia === '▲') up++;
      else if(row.tendencia === '▼') down++;
      else flat++;
      (row.semanas||[]).forEach((v,i)=>{ if(i<4) weeklyTotals[i] += (Number(v)||0); });
    }
    return {
      roteiro,
      clientCount: info.clients.size,
      sugestaoTotal,
      up, down, flat,
      weeklyTotals,
    };
  });
  summaries.sort((a,b)=> b.clientCount - a.clientCount);
  return summaries;
}

function dayCounts(){
  const counts = {};
  WEEKDAY_ORDER.forEach(d => counts[d] = 0);
  DATA.forEach(r => { counts[r.dia] = (counts[r.dia]||0) + 1; });
  return counts;
}

function sortByWeekday(a,b){ return WEEKDAY_ORDER.indexOf(a) - WEEKDAY_ORDER.indexOf(b); }

function kernelBar(weeklyTotals){
  const max = Math.max(...weeklyTotals, 1);
  return `<div class="kernel-bar">${weeklyTotals.map(v=>{
    const h = Math.max(12, Math.round((v/max)*100));
    const cls = v === max ? 'hi' : '';
    return `<i class="${cls}" style="height:${h}%"></i>`;
  }).join('')}</div>`;
}

// ---------- Rendering: day tabs ----------
function renderDayTabs(){
  const counts = dayCounts();
  const tabsEl = document.getElementById('dayTabs');
  tabsEl.innerHTML = WEEKDAY_ORDER.map(d => `
    <button class="day-tab ${d===currentDay?'active':''}" data-day="${d}">
      ${d} <span class="n">${counts[d]||0}</span>
    </button>
  `).join('');
  tabsEl.querySelectorAll('.day-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentDay = btn.dataset.day;
      renderDayTabs();
      renderRoutes();
    });
  });

  document.getElementById('dayContext').innerHTML = `
    <div class="call-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
      Pedidos coletados na ligação de <b>${CALL_DAY_BEFORE[currentDay]}</b>, para entrega <b>${currentDay.toLowerCase()}</b>
    </div>
  `;
}

// ---------- Rendering: routes grid ----------
function renderRoutes(){
  const grid = document.getElementById('routeGrid');
  const summaries = buildRouteSummaries(currentDay);
  const dayTotal = DATA.filter(r=>r.dia===currentDay).length;
  document.getElementById('metaCount').textContent = `${dayTotal} linhas de produto · ${summaries.length} rotas em ${currentDay}`;

  if(summaries.length === 0){
    grid.innerHTML = `<div class="empty-state">Nenhuma entrega registrada para ${currentDay}.</div>`;
    return;
  }

  grid.innerHTML = summaries.map(s => `
    <button class="route-card" data-route="${escapeAttr(s.roteiro)}">
      <div>
        <div class="rname">${escapeHtml(s.roteiro)}</div>
      </div>
      ${kernelBar(s.weeklyTotals)}
      <div class="route-stats">
        <div>
          <div class="rstat-num">${s.clientCount}</div>
          <div class="rstat-label">Clientes</div>
        </div>
        <div style="text-align:right">
          <div class="rstat-num">${s.sugestaoTotal.toLocaleString('pt-BR')}</div>
          <div class="rstat-label">Un. sugeridas</div>
        </div>
      </div>
      <div class="trend-row">
        <span class="t-up">▲ ${s.up}</span>
        <span class="t-down">▼ ${s.down}</span>
        <span class="t-flat">– ${s.flat}</span>
      </div>
    </button>
  `).join('');

  grid.querySelectorAll('.route-card').forEach(btn=>{
    btn.addEventListener('click', ()=> openRoute(currentDay, btn.dataset.route));
  });
}

// ---------- Rendering: route detail ----------
function canonicalWeekLabels(rows){
  const cols = [[],[],[],[]];
  rows.forEach(r=>{
    (r.semanaLabels||[]).forEach((lbl,i)=>{
      if(lbl && !lbl.includes('–')){
        const datePart = lbl.split(' - ')[1];
        if(datePart) cols[i].push(datePart);
      }
    });
  });
  return cols.map(dates=>{
    if(dates.length===0) return null;
    const counts = {};
    dates.forEach(d=> counts[d]=(counts[d]||0)+1);
    return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0];
  });
}

function openRoute(dia, roteiro){
  const rows = DATA.filter(r => r.dia === dia && (r.roteiro || 'N/D') === roteiro);
  const byClient = {};
  for(const row of rows){
    if(!byClient[row.cliente]) byClient[row.cliente] = [];
    byClient[row.cliente].push(row);
  }
  const clients = Object.entries(byClient).map(([cliente, prods])=>{
    const sugestaoTotal = prods.reduce((a,p)=>a+(Number(p.sugestao)||0),0);
    const vendedor = prods[0].vendedor;
    const down = prods.filter(p=>p.tendencia==='▼').length;
    return { cliente, prods, sugestaoTotal, vendedor, down };
  });
  clients.sort((a,b)=> b.sugestaoTotal - a.sugestaoTotal);

  const weekDates = canonicalWeekLabels(rows);

  document.getElementById('routesView').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  document.getElementById('detailEyebrow').textContent = `Entrega ${dia} · ligação ${CALL_DAY_BEFORE[dia]}`;
  document.getElementById('detailTitle').textContent = roteiro;
  const weekLegend = weekDates.map((d,i)=> d ? `S${i+1} ${d}` : `S${i+1} –`).join(' · ');
  document.getElementById('detailSub').innerHTML = `${clients.length} clientes nesta rota &nbsp;·&nbsp; <span style="font-family:'IBM Plex Mono',monospace">${weekLegend}</span>`;

  const totalSugestao = clients.reduce((a,c)=>a+c.sugestaoTotal,0);
  const clientsWithDrop = clients.filter(c=>c.down>0).length;
  document.getElementById('detailSummary').innerHTML = `
    <div class="dsum"><div class="n">${clients.length}</div><div class="l">Clientes</div></div>
    <div class="dsum"><div class="n">${totalSugestao.toLocaleString('pt-BR')}</div><div class="l">Un. sugeridas</div></div>
    <div class="dsum"><div class="n">${clientsWithDrop}</div><div class="l">Com queda</div></div>
  `;

  const listEl = document.getElementById('clientList');
  listEl.innerHTML = clients.map((c, idx) => renderClientBlock(c, idx, weekDates)).join('');

  listEl.querySelectorAll('.client-header').forEach(h=>{
    h.addEventListener('click', ()=> h.closest('.client-block').classList.toggle('open'));
  });

  window.scrollTo({top:0, behavior:'instant'});
}

function renderClientBlock(c, idx, weekDates){
  return `
  <div class="client-block" id="client-${idx}">
    <div class="client-header">
      <div>
        <div class="client-name">${escapeHtml(c.cliente)}</div>
        <div class="client-meta">Vendedor: ${escapeHtml(c.vendedor||'N/D')}</div>
      </div>
      <div class="client-right">
        ${c.down>0 ? `<span class="t-down" style="font-size:12px">▼ ${c.down} em queda</span>` : ''}
        <div style="text-align:right">
          <div class="rstat-num" style="font-size:16px">${c.sugestaoTotal.toLocaleString('pt-BR')}</div>
          <div class="rstat-label">un. sugeridas</div>
        </div>
        <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>
    <div class="client-products">
      <table class="prod-table">
        <thead><tr>
          <th>Produto</th><th>Dia</th><th>4 semanas</th><th>Média</th><th>Sugestão</th><th>Tend.</th><th>Regularidade</th>
        </tr></thead>
        <tbody>
          ${sortProducts(c.prods).map(p=>renderProductRow(p, weekDates)).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderProductRow(p, weekDates){
  const max = Math.max(...(p.semanas||[0]), 1);
  const labels = p.semanaLabels || [];
  const bars = (p.semanas||[]).map((v,i)=>{
    const h = Math.max(10, Math.round((v/max)*100));
    let dateStr = null;
    const lbl = labels[i];
    if(lbl && !lbl.includes('–')) dateStr = lbl.split(' - ')[1];
    else if(weekDates && weekDates[i]) dateStr = weekDates[i];
    const tip = dateStr ? `${dateStr}: ${v} un` : `${v} un`;
    return `<i style="height:${h}%" title="${tip}"></i>`;
  }).join('');
  const regParts = (p.regularidade||'0/4').split('/');
  const regPct = regParts.length===2 ? (parseFloat(regParts[0])/parseFloat(regParts[1]))*100 : 0;
  return `<tr>
    <td>
      <div class="prod-name">${escapeHtml(p.produto||'')}</div>
      <div class="prod-code">${escapeHtml(p.codigo||'')}</div>
    </td>
    <td><span class="day-tag">${p.dia||''}</span></td>
    <td><div class="weeks-mini">${bars}</div></td>
    <td>${fmtNum(p.media)}</td>
    <td class="sugg">${fmtNum(p.sugestao)}</td>
    <td class="tend ${trendClass(p.tendencia)}">${trendGlyph(p.tendencia)}</td>
    <td>
      <div class="reg-bar-wrap">
        <div class="reg-bar"><div style="width:${regPct}%"></div></div>
        <span style="font-size:11px;color:var(--ink-soft)">${p.regularidade||''}</span>
      </div>
    </td>
  </tr>`;
}

function fmtNum(n){
  if(n===null||n===undefined||n==='') return '–';
  const num = Number(n);
  if(Number.isInteger(num)) return num.toLocaleString('pt-BR');
  return num.toLocaleString('pt-BR', {maximumFractionDigits:1});
}

// ---------- Search across all routes ----------
function renderSearch(query){
  const resultsEl = document.getElementById('searchResults');
  const routesViewH2 = document.querySelector('#routesView h2');
  const grid = document.getElementById('routeGrid');
  if(!query || query.trim().length < 2){
    resultsEl.innerHTML = '';
    document.getElementById('dayNav').style.display='';
    grid.style.display='';
    return;
  }
  const q = query.trim().toLowerCase();
  const matches = {};
  for(const row of DATA){
    if(row.cliente && row.cliente.toLowerCase().includes(q)){
      const key = row.cliente + '|' + row.dia + '|' + row.roteiro;
      if(!matches[key]) matches[key] = { cliente: row.cliente, roteiro: row.roteiro, dia: row.dia, prods: [] };
      matches[key].prods.push(row);
    }
  }
  const entries = Object.values(matches);
  routesViewH2 && (routesViewH2.style.display='none');
  document.querySelector('#routesView #dayNav').style.display='none';
  grid.style.display='none';
  if(entries.length === 0){
    resultsEl.innerHTML = `<div class="empty-state">Nenhum cliente encontrado para "${escapeHtml(query)}".</div>`;
    return;
  }
  resultsEl.innerHTML = `<h2>Resultados para "${escapeHtml(query)}"</h2>` + entries.map((info, idx)=>{
    const sugestaoTotal = info.prods.reduce((a,p)=>a+(Number(p.sugestao)||0),0);
    return `<div class="client-block" id="search-client-${idx}">
      <div class="client-header">
        <div>
          <div class="client-name">${escapeHtml(info.cliente)}</div>
          <div class="client-meta">Rota: ${escapeHtml(info.roteiro||'N/D')} · Entrega ${escapeHtml(info.dia)}</div>
        </div>
        <div class="client-right">
          <div style="text-align:right">
            <div class="rstat-num" style="font-size:16px">${sugestaoTotal.toLocaleString('pt-BR')}</div>
            <div class="rstat-label">un. sugeridas</div>
          </div>
          <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
      <div class="client-products">
        <table class="prod-table">
          <thead><tr><th>Produto</th><th>Dia</th><th>4 semanas</th><th>Média</th><th>Sugestão</th><th>Tend.</th><th>Regularidade</th></tr></thead>
          <tbody>${sortProducts(info.prods).map(p=>renderProductRow(p)).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');
  resultsEl.querySelectorAll('.client-header').forEach(h=>{
    h.addEventListener('click', ()=> h.closest('.client-block').classList.toggle('open'));
  });
}

// ---------- Utils ----------
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

// ---------- Init ----------
document.addEventListener('DOMContentLoaded', ()=>{
  loadInitialData();
  renderDayTabs();
  renderRoutes();

  document.getElementById('backBtn').addEventListener('click', ()=>{
    document.getElementById('detailView').style.display='none';
    document.getElementById('routesView').style.display='block';
  });

  let searchTimer;
  document.getElementById('searchInput').addEventListener('input', (e)=>{
    clearTimeout(searchTimer);
    searchTimer = setTimeout(()=> renderSearch(e.target.value), 150);
  });
});

</script>
